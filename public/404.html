<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting to index.html</title>
    <script>
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, -1 * segmentCount + 1)
            .join('/') +
          '/portfoli/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/') +
          l.search +
          l.hash
      );
    </script>
  </head>
  <body>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/portfoli/" />
    </noscript>
  </body>
</html>
